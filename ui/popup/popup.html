<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EAS Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      width: 300px;
      color: #333;
    }
    .header {
      background: #1a73e8;
      color: white;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header .version { font-size: 11px; opacity: .7; }
    .content { padding: 10px 12px; }

    .account {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 9px 11px;
      margin-bottom: 7px;
      cursor: default;
      position: relative;
    }
    .account:hover { background: #fafafa; }

    .account-header {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* Status dot */
    .dot {
      flex-shrink: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }
    .dot.ok        { background: #34a853; }
    .dot.syncing   { background: #fbbc04; }
    .dot.quarantine{ background: #f57c00; }
    .dot.error     { background: #ea4335; }
    .dot.idle      { background: #bdbdbd; }

    .account-name {
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .badge {
      flex-shrink: 0;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 99px;
      font-weight: 700;
      letter-spacing: .3px;
    }
    .badge.syncing    { background: #e8f0fe; color: #1a73e8; }
    .badge.ok         { background: #e6f4ea; color: #2e7d32; }
    .badge.quarantine { background: #fff3e0; color: #e65100; }
    .badge.error      { background: #fce8e6; color: #c62828; }
    .badge.idle       { background: #f5f5f5; color: #757575; }

    .account-meta {
      font-size: 11px;
      color: #888;
      margin-top: 3px;
      padding-left: 16px; /* align under name, past dot */
    }

    .status-line {
      font-size: 11px;
      margin-top: 3px;
      padding-left: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-line.error      { color: #c62828; }
    .status-line.quarantine { color: #e65100; }

    /* Native tooltip via title attr on .account */

    .actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 7px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #f8f8f8;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #333;
    }
    button:hover { background: #eee; }
    button.primary { background: #1a73e8; color: white; border-color: #1a73e8; }
    button.primary:hover { background: #1558b0; }
    #no-accounts { color: #888; text-align: center; padding: 20px 0; font-size: 13px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>EAS Mail Sync</h1>
    <span class="version">v1.0</span>
  </div>
  <div class="content">
    <div id="account-list"></div>
    <div id="no-accounts" style="display:none">No EAS accounts configured.</div>
    <div class="actions">
      <button id="btn-sync-all" class="primary">Sync All</button>
      <button id="btn-setup">Settings</button>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
